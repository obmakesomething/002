<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            font-weight: 400;
            color: #000;
            background: #fff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0;
            margin-bottom: 32px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #000;
            background: transparent;
            font-size: 16px;
            font-family: inherit;
            color: #000;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-bottom-width: 2px;
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        button:hover {
            opacity: 0.8;
        }

        button:active {
            opacity: 0.6;
        }

        button:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
            opacity: 1;
        }

        .error-message {
            background: #f5f5f5;
            border-left: 2px solid #000;
            padding: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .hint {
            margin-top: 48px;
            font-size: 12px;
            color: #999;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 24px;
            }

            input[type="text"],
            button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reader</h1>

        <div class="error-message" id="errorMessage"></div>

        <form onsubmit="handleAccess(event)">
            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <input
                    type="text"
                    id="accessCode"
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>
            <button type="submit" id="accessBtn">Enter</button>
        </form>

        <div class="hint">
            Swiss Typography / 2025
        </div>
    </div>

    <script>
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        async function handleAccess(event) {
            event.preventDefault();
            hideError();

            const accessCode = document.getElementById('accessCode').value;
            const btn = document.getElementById('accessBtn');

            btn.disabled = true;
            btn.textContent = 'Checking...';

            try {
                const response = await fetch('/api/access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.textContent = 'Granted';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 300);
                } else {
                    showError(data.error || 'Invalid code');
                    btn.disabled = false;
                    btn.textContent = 'Enter';
                    document.getElementById('accessCode').value = '';
                    document.getElementById('accessCode').focus();
                }
            } catch (error) {
                showError('Network error');
                btn.disabled = false;
                btn.textContent = 'Enter';
            }
        }

        // Check if already authenticated
        fetch('/api/auth/check')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
