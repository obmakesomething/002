<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Access / PDF Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --system-blue: #007AFF;
            --system-blue-dark: #0051D5;
            --system-red: #FF3B30;
            --system-gray: #8E8E93;
            --system-gray-2: #AEAEB2;
            --system-gray-5: #E5E5EA;
            --system-gray-6: #F2F2F7;
            --label-primary: #000000;
            --label-secondary: #3C3C43;
            --background-primary: #F2F2F7;
            --background-secondary: #FFFFFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            font-size: 17px;
            line-height: 1.47;
            font-weight: 400;
            color: var(--label-primary);
            background: var(--background-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            padding-top: calc(24px + env(safe-area-inset-top));
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            padding-left: calc(24px + env(safe-area-inset-left));
            padding-right: calc(24px + env(safe-area-inset-right));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background: var(--background-secondary);
            border: none;
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1), 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .logo {
            margin-bottom: 48px;
            text-align: center;
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1.5px;
            color: var(--label-primary);
            margin-bottom: 8px;
            line-height: 1;
        }

        .logo p {
            font-size: 17px;
            color: var(--label-secondary);
            font-weight: 400;
            letter-spacing: 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--label-primary);
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            min-height: 52px;
            border: 1px solid var(--system-gray-5);
            border-radius: 12px;
            background: var(--system-gray-6);
            font-size: 17px;
            font-family: inherit;
            color: var(--label-primary);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .form-group input:focus {
            outline: none;
            background: var(--background-secondary);
            border-color: var(--system-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .form-group input::placeholder {
            color: var(--system-gray-2);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            min-height: 52px;
            background: var(--system-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            touch-action: manipulation;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }

        .submit-btn:hover {
            background: var(--system-blue-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: var(--system-gray-5);
            color: var(--system-gray);
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border-left: 3px solid var(--system-red);
            border-radius: 12px;
            color: var(--system-red);
            padding: 16px;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.4;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .hint {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--system-gray-5);
            color: var(--label-tertiary);
            font-size: 13px;
            text-align: center;
        }

        /* iPhone 16 Pro & Mobile Optimization */
        @media (max-width: 768px) {
            body {
                padding: var(--space-2);
                padding-top: calc(var(--space-2) + env(safe-area-inset-top));
                padding-bottom: calc(var(--space-2) + env(safe-area-inset-bottom));
            }

            .container {
                padding: var(--space-4);
                max-width: 100%;
            }

            .logo h1 {
                font-size: 36px;
            }

            .form-group input,
            .submit-btn {
                min-height: 52px;
                padding: var(--space-3);
            }

            * {
                -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: var(--space-3);
                border-width: 1px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Reader</h1>
            <p>Access Required</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form onsubmit="handleAccess(event)">
            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <input
                    type="text"
                    id="accessCode"
                    placeholder=""
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>
            <button type="submit" class="submit-btn" id="accessBtn">Enter</button>
        </form>

        <div class="hint">
            Swiss Typography System / 2025
        </div>
    </div>

    <script>
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        async function handleAccess(event) {
            event.preventDefault();
            hideError();

            const accessCode = document.getElementById('accessCode').value;
            const btn = document.getElementById('accessBtn');

            btn.disabled = true;
            btn.textContent = 'Checking...';

            try {
                const response = await fetch('/api/access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.textContent = 'Access Granted';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 300);
                } else {
                    showError(data.error || 'Invalid access code');
                    btn.disabled = false;
                    btn.textContent = 'Enter';
                    document.getElementById('accessCode').value = '';
                    document.getElementById('accessCode').focus();
                }
            } catch (error) {
                showError('Network error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Enter';
            }
        }

        // Check if already authenticated
        fetch('/api/auth/check')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/';
                }
            });
    </script>
</body>
</html>
