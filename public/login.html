<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access / PDF Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --gray-900: #171717;
            --gray-800: #333333;
            --gray-600: #737373;
            --gray-500: #a3a3a3;
            --gray-300: #d4d4d4;
            --gray-200: #e5e5e5;
            --gray-100: #f5f5f5;
            --gray-50: #fafafa;
            --white: #ffffff;
            --red: #ff0000;

            --grid: 8px;
            --space-1: calc(var(--grid) * 1);
            --space-2: calc(var(--grid) * 2);
            --space-3: calc(var(--grid) * 3);
            --space-4: calc(var(--grid) * 4);
            --space-6: calc(var(--grid) * 6);
            --space-8: calc(var(--grid) * 8);
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 400;
            color: var(--black);
            background: var(--white);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--space-3);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background: var(--white);
            border: 2px solid var(--black);
            padding: var(--space-6);
            width: 100%;
            max-width: 480px;
        }

        .logo {
            margin-bottom: var(--space-6);
            text-align: left;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--black);
            margin-bottom: var(--space-1);
            line-height: 1;
        }

        .logo p {
            font-size: 11px;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: var(--space-2);
            font-weight: 500;
            color: var(--gray-800);
        }

        .form-group input {
            width: 100%;
            padding: var(--space-2);
            border: 1px solid var(--black);
            background: var(--white);
            font-size: 16px;
            font-family: inherit;
            color: var(--black);
            transition: background 0.15s ease;
        }

        .form-group input:focus {
            outline: none;
            background: var(--gray-50);
        }

        .form-group input::placeholder {
            color: var(--gray-300);
        }

        .submit-btn {
            width: 100%;
            padding: var(--space-2);
            background: var(--black);
            color: var(--white);
            border: none;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: opacity 0.15s ease;
            font-family: inherit;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        .submit-btn:active {
            opacity: 0.7;
        }

        .submit-btn:disabled {
            background: var(--gray-300);
            color: var(--gray-600);
            cursor: not-allowed;
            opacity: 1;
        }

        .error-message {
            background: var(--gray-50);
            border-left: 3px solid var(--red);
            color: var(--gray-900);
            padding: var(--space-2);
            margin-bottom: var(--space-3);
            font-size: 12px;
            line-height: 1.4;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .hint {
            margin-top: var(--space-4);
            padding-top: var(--space-4);
            border-top: 1px solid var(--gray-200);
            color: var(--gray-500);
            font-size: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        @media (max-width: 480px) {
            .container {
                padding: var(--space-4);
                border-width: 1px;
            }

            .logo h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Reader</h1>
            <p>Access Required</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form onsubmit="handleAccess(event)">
            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <input
                    type="text"
                    id="accessCode"
                    placeholder="웰시댕구"
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>
            <button type="submit" class="submit-btn" id="accessBtn">Enter</button>
        </form>

        <div class="hint">
            Swiss Typography System / 2025
        </div>
    </div>

    <script>
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        async function handleAccess(event) {
            event.preventDefault();
            hideError();

            const accessCode = document.getElementById('accessCode').value;
            const btn = document.getElementById('accessBtn');

            btn.disabled = true;
            btn.textContent = 'Checking...';

            try {
                const response = await fetch('/api/access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.textContent = 'Access Granted';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 300);
                } else {
                    showError(data.error || 'Invalid access code');
                    btn.disabled = false;
                    btn.textContent = 'Enter';
                    document.getElementById('accessCode').value = '';
                    document.getElementById('accessCode').focus();
                }
            } catch (error) {
                showError('Network error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Enter';
            }
        }

        // Check if already authenticated
        fetch('/api/auth/check')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/';
                }
            });
    </script>
</body>
</html>
